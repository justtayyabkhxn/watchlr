<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Watchlr</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #ededed;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .wrap { padding: 24px; }
      .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #ededed; display: inline-block; margin: 0 3px;
        animation: b 1s infinite ease-in-out;
      }
      .dot:nth-child(2) { animation-delay: .15s; }
      .dot:nth-child(3) { animation-delay: .3s; }
      @keyframes b { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
      p { opacity: .7; margin-top: 16px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <p>Loading Watchlr&hellip;</p>
      <p id="offline" style="display:none">You appear to be offline. Check your connection.</p>
    </div>
    <script>
      // This page is only shown as a fallback while the remote app loads
      // (or when the device is offline). The WebView normally loads server.url.
      if (!navigator.onLine) {
        document.getElementById('offline').style.display = 'block';
      }
    </script>
  </body>
</html>
